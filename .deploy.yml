version: 1
service: nighthawk
type: container
target: railway

spec:
  replicas: 1
  volumes:
    - name: data
      mountPath: /app/data
  env:
    NIGHTHAWK_DATA_DIR: /app/data
    # Railway volumes are root-owned, overriding the image's default UID 1001.
    RAILWAY_RUN_UID: "0"
  containerPort: 8080
  artifact:
    dockerfilePath: Dockerfile
  http:
    healthCheck:
      path: /healthz
  rollback: true

environments:
  dev:
    memoryLimitGb: 1
  prod:
    memoryLimitGb: 1
  production:
    memoryLimitGb: 1
