version: 1
service: nighthawk
type: container
target: railway

# Provision the Railway volume at /app/data separately; see DEPLOYMENT.md.
# This custom Deployer manifest has no verified volume provisioning field.
spec:
  replicas: 1
  containerPort: 8080
  artifact:
    dockerfilePath: Dockerfile
  http:
    healthCheck:
      path: /healthz
  rollback: true

environments:
  dev:
    memoryLimitGb: 1
  prod:
    memoryLimitGb: 1
  production:
    memoryLimitGb: 1
